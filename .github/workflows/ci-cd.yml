name: CI/CD Lab

on:
  push:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build Docker image
        run: docker build -t cicd-lab:ci .

  cd:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Deploy and check health on VPS
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST secret}"
          : "${VPS_USER:?Missing VPS_USER secret}"
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY secret}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" bash -se -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          cd /opt/cicd-lab

          # Deploy chính xác commit đã vượt qua CI.
          git fetch origin main
          git reset --hard "$1"
          docker compose up -d --build

          for attempt in {1..10}; do
            if response=$(curl -fsS --max-time 3 http://127.0.0.1:8000/health) \
              && [ "$response" = '{"status":"ok"}' ]; then
              echo "Deploy thành công: /health trả về $response"
              exit 0
            fi
            echo "Health check lần $attempt/10 chưa thành công."
            sleep 2
          done

          echo "Deploy thất bại: /health không trả về HTTP 2xx với {\"status\":\"ok\"}." >&2
          docker compose logs --tail=50 app >&2
          exit 1
          REMOTE
